
<!DOCTYPE html>
<html>
<head>
    <title>TrustVault - Edit Document</title>
</head>
<body>

    <h1>TrustVault</h1>
    <h2>Edit Document</h2>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p style="color: red;">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <input type="hidden" name="csrf_token"
               value="{{ csrf_token() }}">

        <label>Document Name:</label>
        <input
            type="text"
            name="filename"
            value="{{ document.filename }}"
            required
        >

        <br><br>

        <label>Category:</label>

        <select name="category" required>

            <option value="Personal"
                {% if document.category == "Personal" %}selected{% endif %}>
                Personal
            </option>

            <option value="Education"
                {% if document.category == "Education" %}selected{% endif %}>
                Education
            </option>

            <option value="Work"
                {% if document.category == "Work" %}selected{% endif %}>
                Work
            </option>

            <option value="Other"
                {% if document.category == "Other" %}selected{% endif %}>
                Other
            </option>

        </select>

        <br><br>

        <button type="submit">Save Changes</button>

    </form>

    <br>

    <a href="{{ url_for('dashboard') }}">
        Back to Dashboard
    </a>

</body>
</html>
