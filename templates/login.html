
<!DOCTYPE html>
<html>
<head>
    <title>TrustVault Login</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="login-box">

        <h1>TrustVault</h1>
        <h3>Secure Document Sharing System</h3>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <input type="hidden" name="csrf_token"
                   value="{{ csrf_token() }}">

            <input type="email"
                   name="email"
                   placeholder="Enter Email Address"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Enter Password"
                   required>

            <button type="submit">Login</button>

        </form>

    </div>

</body>
</html>
